[project]
name = "todo-jupyter-poc" # TODO: replace with the project name
version = "0.1.0"
description = "TODO: Describe the customer PoC without confidential details"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TODO: Responsible team" }]
dependencies = []
# TODO: Choose and document a license before publishing.

[project.optional-dependencies]
notebook = [
    "ipykernel>=6,<7",
    "jupyterlab>=4,<5",
]

[dependency-groups]
dev = [
    "nbformat>=5,<6",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
