name: testing

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Install locked dependencies
        run: uv sync --locked --group dev --group docs
      - name: Check file hygiene and hooks
        run: uv run --locked pre-commit run --all-files
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Test with line and branch coverage
        run: uv run --locked pytest --cov --cov-report=term-missing
      - name: Check notebooks without executing them
        run: uv run --locked coverage run --append scripts/check_notebooks.py
      - name: Build package
        run: uv build
      - name: Check distribution metadata
        run: uv run --locked twine check dist/*
      - name: Install wheel in a fresh environment and run the quickstart
        run: uv run --locked coverage run --append scripts/check_distribution.py
      - name: Build documentation
        run: uv run --locked --group docs sphinx-build -b html docs docs/_build/html
      - name: Report coverage without a percentage gate
        run: |
          uv run --locked coverage report
          uv run --locked coverage xml
          uv run --locked coverage html
      - name: Upload coverage reports to Codecov (opt-in)
        if: ${{ vars.CODECOV_ENABLED == 'true' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Save coverage reports
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 7
