name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, use SECURITY.md instead of this public form.
        Remove secrets, customer data, and confidential paths from examples and logs.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using synthetic or public data.
    validations:
      required: true
  - type: input
    id: package_version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "For example, Python 3.11.13"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, installation method, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove sensitive values before submitting.
      render: shell
